<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | Good Things</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="brand">Good Things</p>
    <h1>Welcome back</h1>
    <p class="subheading">Sign in to see what’s in store.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button class="button button-full" type="submit" id="loginBtn">Sign in</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="auth-footer">New here? <a href="/signup.html" id="signupLink">Create an account</a></p>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    if (new URLSearchParams(window.location.search).has("created")) {
      message.textContent = "Account created. You can sign in now.";
      message.className = "message success";
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Signing in…";
      message.className = "message";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: form.email.value, password: form.password.value }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || "Sign in failed");
        localStorage.setItem("token", data.token);
        window.location.href = "/home.html";
      } catch (error) {
        message.textContent = error.message === "Failed to fetch" ? "Could not connect. Please try again." : error.message;
        message.className = "message error";
      }
    });
  </script>
</body>
</html>
